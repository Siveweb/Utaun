name: Build Cross-Platform Utaun App (Perfect Fixed)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'ver-*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: コード取得
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ライブラリインストール
      run: |
        python -m pip install --upgrade pip
        pip install numpy Pillow pyinstaller

    - name: 【Windows用】コードの準備 
      if: matrix.os == 'windows-latest'
      run: |
        echo "Windowsビルド準備完了"

    - name: 【Mac/Linux用】アップデート機能やパス変更
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        
        sed -i 's/import winsound/# import winsound/g' utaun.py
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          sed -i "s/winsound.PlaySound(tmp_name, winsound.SND_FILENAME)/import subprocess; subprocess.Popen(['afplay', tmp_name])/g" utaun.py
        else
          sed -i "s/winsound.PlaySound(tmp_name, winsound.SND_FILENAME)/import subprocess; subprocess.Popen(['aplay', tmp_name])/g" utaun.py
        fi
        
        
        python patch_path.py

      
        python patch_update.py

    - name: アプリの作成 (PyInstaller)
      run: pyinstaller --onefile --noconsole utaun.py

    - name: 各OSごとのファイル圧縮 (Windows)
      if: matrix.os == 'windows-latest'
      run: powershell Compress-Archive -Path dist/*.exe -DestinationPath utaun-windows.zip

    - name: 各OSごとのファイル圧縮 (Mac)
      if: matrix.os == 'macos-latest'
      run: zip -r utaun-mac.zip dist/

    - name: 各OSごとのファイル圧縮 (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: zip -r utaun-linux.zip dist/

    - name: GitHub Releasesへ
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          utaun-windows.zip
          utaun-mac.zip
          utaun-linux.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
